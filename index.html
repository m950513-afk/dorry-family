<meta property="og:description" content="12문항으로 만나는 나와 닮은 도르리패밀리 친구! 궁합과 발전 방향까지 확인해 보세요.">

<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6ee;--card:#fff;--ink:#5a3a2e;--sub:#9a7f72;--pink:#e5698f;--soft:#ffe9e2;--line:#f1dfd5;--me:#ffd6df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f1b;--card:#3a2c27;--ink:#f6e6dc;--sub:#c2a89a;--soft:#4a3731;--line:#4d3b34;--me:#6b3a4a}}
:root[data-theme="dark"]{--bg:#2a1f1b;--card:#3a2c27;--ink:#f6e6dc;--sub:#c2a89a;--soft:#4a3731;--line:#4d3b34;--me:#6b3a4a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
main{flex:1;min-height:0;overflow-y:auto;padding:14px 18px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
h1,h2,.jua{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
.top{display:flex;justify-content:space-between;font-size:22px}
.logo{font-size:46px;line-height:1;margin:6px 0 8px;text-align:center;letter-spacing:1px}
.ctr{text-align:center}.sub{color:var(--sub);font-size:14px;margin:4px 0 12px}
.cloud{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-items:end;justify-items:center;margin:8px 0 16px}
.cloud>*:nth-child(3n+2){margin-bottom:-14px}
.cta{display:block;width:100%;padding:15px;border-radius:14px;background:var(--pink);color:#fff;font-size:17px;margin-top:10px}
.ghost{display:block;width:100%;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:16px;margin-top:10px}
.c{display:block;transform-origin:50% 100%;animation:var(--a) var(--d) ease-in-out infinite;animation-delay:var(--w);max-width:100%;object-fit:contain}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.94)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}}
@keyframes wig{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-6deg)}86%{transform:rotate(6deg)}93%{transform:rotate(-3deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.pop .c{animation-delay:.6s}
.hd{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.hd h2{font-size:22px;margin:0}.back{background:none;font-size:24px;width:40px;text-align:left}
.prog{position:relative;height:8px;border-radius:8px;background:var(--soft);margin:16px 0 8px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:#f8b26a;transition:width .3s}
.prog b{position:absolute;top:-8px;transform:translateX(-50%);background:#f8b26a;color:#fff;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:400;transition:left .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.q{font-size:17px;text-align:center;margin:0 0 14px;line-height:1.5}
.opt{display:block;width:100%;padding:13px;margin-top:8px;border-radius:12px;background:var(--soft);font-size:15px}
.opt:active{background:var(--pink);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.tags span{background:var(--soft);border-radius:14px;padding:6px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fr{border-radius:16px;padding:12px 4px 10px;text-align:center;background:var(--bg);background-image:linear-gradient(var(--t),var(--t));border:0}
.fr .box{height:88px;display:flex;align-items:flex-end;justify-content:center}
.fr p{margin:8px 0 0;font-size:14px}.fr small{color:var(--sub);margin-left:4px;font-size:11px}
nav{flex:none;display:flex;border-top:1px solid var(--line);background:var(--bg);padding:6px 0 8px}
nav button{flex:1;background:none;font-size:12px;color:var(--sub)}
nav button span{display:block;font-size:22px;filter:grayscale(1);opacity:.55}
nav button.on{color:var(--ink)}nav button.on span{filter:none;opacity:1}
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;padding:8px 2px;white-space:pre-line}
.m{display:flex;align-items:flex-end;gap:8px;margin:12px 0}
.m.me{justify-content:flex-end}.m .av{width:40px;flex:none}
.b{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;max-width:70%;line-height:1.5}
.me .b{background:var(--me);border:0}.tm{font-size:11px;color:var(--sub)}
.dots{display:inline-flex;gap:4px;padding:4px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:bob .8s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.bar{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:26px;padding:6px 6px 6px 18px;color:var(--sub);margin:8px 0;cursor:pointer;width:100%;text-align:left}
.bar i{width:38px;height:38px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-style:normal}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stats .card{padding:12px}.stats small{color:var(--sub);display:block;margin-bottom:6px}.stats b{font-size:20px;font-weight:400;font-family:'Jua',sans-serif}
.pill{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:13px}
.emo{display:flex;align-items:center;gap:16px}
.donut{width:130px;height:130px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#f28b96 0 45%,#ffcf6b 45% 75%,#8fc4f5 75% 90%,#f4a9a0 90% 100%)}
.hole{width:78px;height:78px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.lg{flex:1;font-size:14px}.lg div{display:flex;justify-content:space-between;margin:7px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.rc{display:flex;align-items:center;gap:12px;margin-top:10px}.rc p{margin:2px 0 0;color:var(--sub);font-size:13px}
.stage{position:relative;height:156px;margin:14px 0 12px;border-radius:28px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(circle at 50% 75%,var(--t),transparent 72%),var(--soft)}
.stage:after{content:"";position:absolute;bottom:12px;left:50%;width:84px;height:10px;margin-left:-42px;border-radius:50%;background:rgba(90,58,46,.15);filter:blur(3px)}
.pose{position:relative;z-index:1;margin-bottom:14px}
.bub{position:absolute;top:16px;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px 13px;font-size:14px;max-width:44%;box-shadow:0 4px 12px rgba(90,58,46,.1)}
.prop{position:absolute;z-index:2;font-size:30px;bottom:34px;animation:bob 2.2s ease-in-out infinite}
.hero{margin:-14px -18px 0;padding:24px 18px 8px;text-align:center;position:relative;overflow:hidden;background:var(--soft);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 32%,var(--bg)),var(--bg))}
.badge{display:inline-block;background:var(--card);border-radius:20px;padding:6px 16px;font-size:14px;box-shadow:0 2px 8px rgba(90,58,46,.1)}
.name{font-size:50px;line-height:1.1;margin:4px 0 8px;color:var(--acc)}
.mb{display:inline-block;background:var(--acc);color:#fff;border-radius:14px;padding:3px 14px;font-size:16px;font-family:'Jua',sans-serif}
.ds{margin:12px 0 0;line-height:1.5}
.hill{position:relative;height:178px;margin:6px -18px 0;display:flex;justify-content:center;align-items:flex-end}
.hill:before{content:"";position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px -95px -95px -95px;top:56%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),transparent 70%)}
.hill .pop{position:relative;z-index:1;margin-bottom:24px}
.sec{margin-top:24px}.sec h3{font-family:'Jua',sans-serif;font-weight:400;font-size:21px;margin:0 0 10px}
.tb{width:100%;border-collapse:collapse}.tb th{font-weight:400;font-size:12px;color:var(--sub);text-align:left;padding:0 6px 8px}
.tb td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:middle;font-size:13px}
.tb tr[data-g]{cursor:pointer}.tb small{color:var(--sub);display:block}
.meter{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin-bottom:4px}.meter i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#ffb5c8,var(--pink))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;z-index:9;white-space:nowrap}
.hero>*:not(.au){position:relative;z-index:1}
.au{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;background:var(--acc);animation:drift 9s ease-in-out infinite alternate}
.a1{width:190px;height:190px;left:-50px;top:10px}.a2{width:160px;height:160px;right:-40px;top:150px;background:#ffb5c8;animation-delay:-4s}
@keyframes drift{to{transform:translate(30px,26px) scale(1.15)}}
.rg{position:absolute;left:50%;top:56%;width:120px;height:120px;margin:-60px;border-radius:50%;border:1.5px solid var(--acc);opacity:0;animation:ring 1.9s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes ring{0%{transform:scale(.4);opacity:.75}100%{transform:scale(2);opacity:0}}
.pt{position:absolute;left:50%;top:56%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:var(--acc);opacity:0;animation:burst 1.4s cubic-bezier(.15,.8,.2,1) both}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}65%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.sp{position:absolute;width:16px;height:16px;background:linear-gradient(135deg,#fff,var(--acc));clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.name{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(8px)}}
.qt{border-left:5px solid var(--acc);border-radius:8px 18px 18px 8px}.qt p{margin:0;line-height:1.7}
.au,.rg,.pt,.sp,.name{will-change:transform}
.ov{position:fixed;inset:0;background:rgba(40,25,20,.72);display:grid;place-items:center;z-index:10;padding:18px}.ov .box{background:var(--card);border-radius:22px;padding:14px;max-width:360px;width:100%;text-align:center}.ov img{max-width:100%;max-height:60vh;border-radius:12px;display:block;margin:0 auto 10px}.ov p{margin:4px 0 10px;color:var(--sub);font-size:14px}.ov a{text-decoration:none}
@media(prefers-reduced-motion:reduce){.c,.pop,.dots i,.au,.rg,.pt,.sp,.name{animation:none}}
</style></head><body><div id="app"></div>
